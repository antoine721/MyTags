name: ci-cli

on:
  push:
    paths: ["mac-cli/**", "shared/**", ".github/workflows/ci-cli.yml"]
  pull_request:
    paths: ["mac-cli/**", "shared/**", ".github/workflows/ci-cli.yml"]

concurrency:
  group: ci-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mac-cli
    steps:
      - uses: actions/checkout@v5
      - name: Audio tools
        timeout-minutes: 10  # a stalled Ubuntu mirror must fail fast, not hang for hours
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y ffmpeg libchromaprint-tools
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Shared config in sync
        run: cmp ../shared/default-config.json src/djtag/data/default-config.json
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright
      - run: uv run pytest -q
