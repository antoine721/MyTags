[project]
name = "djtag"
version = "0.1.0"
description = "MyTags Mac tool: audit, import, diff, apply and rollback of DJ tags"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mutagen==1.47.0",
  "typer==0.15.1",
  "rich==13.9.4",
  "httpx==0.28.1",
  "keyring==25.6.0",
  "pillow==11.1.0",
  "segno==1.6.6",
]

[project.scripts]
djtag = "djtag.cli:main"

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "hypothesis==6.124.7",
  "ruff==0.9.4",
  "pyright==1.1.393",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djtag"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
